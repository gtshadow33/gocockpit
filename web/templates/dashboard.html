<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GoCockpit - Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f4f4f5;
            color: #18181b;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;

            background: #18181b;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        .user {
            color: #d4d4d8;
            font-size: 14px;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 24px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .welcome p {
            margin: 0;
            color: #71717a;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #e4e4e7;
            border-radius: 14px;
            padding: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h3 {
            margin: 0;
            font-size: 16px;
            color: #52525b;
        }

        .value {
            margin: 20px 0;
            font-size: 42px;
            font-weight: 700;
        }

        .bar {
            width: 100%;
            height: 10px;
            background: #e4e4e7;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #18181b;
            border-radius: 10px;

            width: {{ .CPU }}%;
        }

        .ram .bar-fill {
            width: {{ .RAM }}%;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 20px;
            }

            main {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>GoCockpit</h1>

        <div class="user">
            {{ .Username }}
        </div>
    </header>

    <main>

        <section class="welcome">
            <h2>Dashboard</h2>
            <p>Estado actual del sistema</p>
        </section>

        <section class="stats">

            <article class="card">

                <div class="card-header">
                    <h3>CPU</h3>
                    <span>{{ .CPU }}%</span>
                </div>

                <div class="value">
                    {{ .CPU }}%
                </div>

                <div class="bar">
                    <div class="bar-fill"></div>
                </div>

            </article>


            <article class="card ram">

                <div class="card-header">
                    <h3>RAM</h3>
                    <span>{{ .RAM }}%</span>
                </div>

                <div class="value">
                    {{ .RAM }}%
                </div>

                <div class="bar">
                    <div class="bar-fill"></div>
                </div>

            </article>

        </section>

    </main>

</body>

</html>
