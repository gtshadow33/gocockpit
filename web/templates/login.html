
<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GoCockpit - Login</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >

</head>

<body class="login-page">

    <main class="login-card">

        <div class="login-brand">

            <h1>GoCockpit</h1>

            <p>
                Panel de administración del sistema
            </p>

        </div>


        <form
            method="POST"
            action="/login"
        >

            <label>

                Usuario

                <input
                    type="text"
                    name="username"
                    required
                    autocomplete="username"
                >

            </label>


            <label>

                Contraseña

                <input
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >

            </label>


            <button type="submit">
                Iniciar sesión
            </button>

        </form>

    </main>

</body>

</html>
