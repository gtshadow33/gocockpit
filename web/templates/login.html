<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GoCockpit - Login</title>
</head>
<body>

<h1>GoCockpit</h1>

<form method="POST" action="/login">

    <label>
        Usuario
        <input type="text" name="username" required>
    </label>

    <br>

    <label>
        Contraseña
        <input type="password" name="password" required>
    </label>

    <br>

    <button type="submit">
        Iniciar sesión
    </button>

</form>

</body>
</html>
