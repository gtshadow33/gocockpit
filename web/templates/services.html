
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Servicios - GoCockpit</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >

</head>

<body>

    {{ template "navbar" . }}


    <main class="main">

        <section class="welcome">

            <h2>
                Servicios
            </h2>

            <p>
                Estado de los servicios del sistema
            </p>

        </section>


        <section class="services">

            {{ range .Services }}

            <article class="service {{ .Status }}">

                <div class="service-name">

                    <span class="service-indicator"></span>

                    <span class="service-label">
                        {{ .Name }}
                    </span>

                </div>


                <div class="service-actions">

                    <span class="service-status {{ .Status }}">
                        {{ .Status }}
                    </span>


                    {{ if eq .Status "active" }}

                    <form
                        method="POST"
                        action="/services/stop"
                    >

                        <input
                            type="hidden"
                            name="service"
                            value="{{ .Name }}"
                        >

                        <label class="toggle">

                            <input
                                type="checkbox"
                                checked
                                onchange="this.form.submit()"
                            >

                            <span class="toggle-slider"></span>

                        </label>

                    </form>


                    {{ else }}

                    <form
                        method="POST"
                        action="/services/start"
                    >

                        <input
                            type="hidden"
                            name="service"
                            value="{{ .Name }}"
                        >

                        <label class="toggle">

                            <input
                                type="checkbox"
                                onchange="this.form.submit()"
                            >

                            <span class="toggle-slider"></span>

                        </label>

                    </form>

                    {{ end }}

                </div>

            </article>


            {{ else }}

            <p class="empty">
                No se encontraron servicios.
            </p>

            {{ end }}

        </section>

    </main>


    {{ template "footer" . }}

</body>

</html>
