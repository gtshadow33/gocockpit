
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 - GoCockpit</title>

    <link
        rel="stylesheet"
        href="/static/css/app.css"
    >

</head>

<body>

    {{ template "navbar" . }}

    <main class="main">

        <section class="error-page">

            <div class="error-content">

                <p class="error-code">
                    404
                </p>

                <h1 class="error-title">
                    Página no encontrada
                </h1>

                <p class="error-description">
                    La página que estás buscando no existe,
                    ha sido movida o la dirección no es correcta.
                </p>

                <a
                    href="/dashboard"
                    class="error-button"
                >
                    Volver al dashboard
                </a>

                <p class="error-path">
                    GoCockpit · Error 404
                </p>

            </div>

        </section>

    </main>

    {{ template "footer" . }}

</body>

</html>
